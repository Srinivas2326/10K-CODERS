<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <center>
    <h2>Sign Up</h2>
    <form action="login.html" >
        <label>First Name:</label>
        <input type="text" placeholder="Enter Your First Name"required autocomplete="off"><br><br>
        <label>Last Name:</label>
        <input type="text" placeholder="Enter Your Last Name"required><br><br>
        <label>Email id:</label>
        <input type="email" placeholder="Enter Your Email"required><br><br>
        <label>Password:</label>
        <input type="password" placeholder="Set Password"required><br><br>
        <label>Confirm Password:</label>
        <input type="password" placeholder="Confirm Password"required><br><br>
        <input type="submit" value="Sign Up">
        <!-- <p>Already have an account? <a href="login.html">Login</a></p> -->

    </form>
    </center>
</body>
</html>
